# Liquor Import, Sales & Distribution System
#   docker compose up -d --build      →  http://localhost:8080
# Settings come from .env (copy .env.example). The database is created and seeded on first start.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lisd
      POSTGRES_USER: lisd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisd -d lisd"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Uncomment to reach the database from your machine (e.g. a SQL client). 5433 avoids clashing with a local Postgres.
    # ports:
    #   - "5433:5432"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lisd:${POSTGRES_PASSWORD:-change-me-db-password}@db:5432/lisd
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (at least 32 random characters)}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      # "Continue as guest" (read-only, prices hidden). Empty = follow DEMO_MODE.
      ALLOW_GUEST: ${ALLOW_GUEST:-}
      # Cookies are sent over plain HTTP on localhost; set to true behind HTTPS.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    # Reachable from this machine only, so `npm run dev` (Vite on :5173) can use the running API.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Daily database + document backups into ./backups (kept BACKUP_KEEP_DAYS days). Restore: see README.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Bangkok
    volumes:
      - ./docker/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro
    depends_on:
      db:
        condition: service_healthy

  # Optional HTTPS on a real domain: set DOMAIN (and SECURE_COOKIES=true) in .env, then
  #   docker compose --profile https up -d
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
