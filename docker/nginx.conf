server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Document uploads (the API enforces its own 10 MB limit).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx drops server-level add_header in any location that sets its own, so each location below
    # includes the same set (security-headers.conf).
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change — cache them hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes: every other path serves the app shell.
    location / {
        include /etc/nginx/security-headers.conf;
        # The app only loads its own code, Google Fonts, and images it made itself (data: URLs).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
